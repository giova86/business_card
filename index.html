    <style>
        :root {
            --primary: #00d2ff;
            --secondary: #3a7bd5;
            --accent: #ff6b6b;
            --bg-dark: #0a0a0a;
            --bg-darker: #050505;
            --text-light: #ffffff;
            --text-gray: #b0b0b0;

            /* Glassmorphism */
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-bg-hover: rgba(255, 255, 255, 0.10);
            --glass-border: rgba(255, 255, 255, 0.14);
            --glass-blur: 14px;
            --gradient: linear-gradient(135deg, var(--primary), var(--secondary));

            --radius: 18px;
            --radius-pill: 999px;
            --transition: 0.3s ease;
        }

        * { box-sizing: border-box; }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100%;
            min-height: 100dvh;
            background-color: var(--bg-dark);
            color: var(--text-light);
            flex-direction: column;
            position: relative;
            padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
            -webkit-font-smoothing: antialiased;
        }

        /* ---------- Animated background ---------- */
        .bg-animation {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 18% 78%, rgba(0, 210, 255, 0.14) 0%, transparent 48%),
                radial-gradient(circle at 82% 22%, rgba(255, 107, 107, 0.12) 0%, transparent 48%),
                var(--bg-darker);
        }
        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.5;
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0.4; }
            50% { transform: translateY(-20px) rotate(180deg); opacity: 1; }
        }

        /* ---------- Main glass card ---------- */
        .main-content {
            width: 100%;
            max-width: 480px;
            text-align: center;
            padding: 36px 26px 30px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            animation: fadeInScale 0.7s ease-out forwards;
        }
        @keyframes fadeInScale {
            from { opacity: 0; transform: translateY(12px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ---------- Profile ---------- */
        .profile-section {
            margin-bottom: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-pic {
            width: 128px;
            height: 128px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--primary);
            margin-bottom: 16px;
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.55);
            animation: profileGlow 2.4s ease-in-out infinite alternate;
        }
        @keyframes profileGlow {
            from { box-shadow: 0 0 20px rgba(0, 210, 255, 0.45); }
            to { box-shadow: 0 0 34px rgba(0, 210, 255, 0.9); }
        }
        .profile-name {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, var(--primary), #6fb4ff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            line-height: 1.2;
        }
        .profile-role {
            margin: 8px 0 0;
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-gray);
        }

        /* ---------- Links grid (1 col mobile, 2 col desktop) ---------- */
        .social-links {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
        }
        @media (min-width: 560px) {
            .social-links { grid-template-columns: 1fr 1fr; }
        }

        .social-button {
            display: grid;
            grid-template-columns: 40px 1fr 40px;
            align-items: center;
            padding: 12px 16px;
            min-height: 62px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            color: var(--text-light);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.4px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
            position: relative;
            overflow: hidden;
            transition: transform var(--transition), background var(--transition),
                        box-shadow var(--transition), border-color var(--transition);
        }
        /* trailing spacer keeps label optically centered against the icon */
        .social-button::after {
            content: '';
        }
        .social-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.18), transparent);
            transition: left 0.6s ease;
        }
        .social-button:hover {
            background: var(--glass-bg-hover);
            border-color: rgba(0, 210, 255, 0.45);
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), 0 0 18px rgba(0, 210, 255, 0.25);
        }
        .social-button:hover::before { left: 100%; }
        .social-button:active {
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(0, 0, 0, 0.35);
        }

        .icon-circle {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            box-shadow: 0 0 14px rgba(0, 210, 255, 0.45);
        }
        .circle-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .button-text {
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- Small phones ---------- */
        @media (max-width: 360px) {
            .main-content { padding: 28px 18px 24px; }
            .profile-pic { width: 108px; height: 108px; }
            .profile-name { font-size: 1.65rem; }
            .social-button { font-size: 0.92rem; min-height: 56px; }
        }

        /* ---------- Reduced motion ---------- */
        @media (prefers-reduced-motion: reduce) {
            .particle,
            .profile-pic,
            .main-content { animation: none !important; }
            .social-button,
            .social-button::before { transition: none !important; }
        }
    </style>
</head>
<body>
    <div class="bg-animation" id="bgAnimation"></div>

    <main class="main-content">

    <script>
        // Lightweight floating particles (skipped if the user prefers reduced motion)
        function createParticles() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const bg = document.getElementById('bgAnimation');
            const count = 40;
            const frag = document.createDocumentFragment();
            for (let i = 0; i < count; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = (i * 97 % 100) + '%';
                p.style.top = (i * 53 % 100) + '%';
                p.style.animationDelay = (i % 6) + 's';
                p.style.animationDuration = (3 + (i % 4)) + 's';
                frag.appendChild(p);
            }
            bg.appendChild(frag);
        }

        document.addEventListener('DOMContentLoaded', createParticles);

        // PWA service worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(() => {});
            });
        }
    </script>
</body>
